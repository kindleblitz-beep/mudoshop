name: Deploy static site to Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Staging
        run: |
          mkdir -p $GITHUB_WORKSPACE/staging
          cp index.html logo.png prod1.png prod2.png prod3.png prod4.png prod5.png $GITHUB_WORKSPACE/staging/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: staging
      - id: deployment
        uses: actions/deploy-pages@v4
